stages:
  - check
  - release

default:
  image: node:22-bookworm
  interruptible: true

.check:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.19.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

check:
  extends: .check
  stage: check
  script:
    - pnpm check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

publish:
  extends: .check
  stage: release
  interruptible: false
  resource_group: npm-publish
  needs:
    - check
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - test -n "${NPM_ID_TOKEN}"
    - node scripts/assert-release-tag.mjs
    - npm install -g npm@^11.5.1
    - pnpm build
    - pnpm publish -r --access public --no-git-checks
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
