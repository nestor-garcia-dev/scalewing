name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag for one package (tokens-vX.Y.Z, react-vX.Y.Z, or react-native-vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish to npm after validation (leave off for a dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scalewing-npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.release-commit.outputs.sha }}
      package: ${{ steps.request.outputs.package }}
    steps:
      - name: Validate request
        id: request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^(tokens|react-native|react)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == true && "$ENABLED" != true ]]; then
            echo "Configure the npm trusted publisher before enabling NPM_PUBLISH_ENABLED."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from main
        id: release-commit
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-release-tag.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - run: node scripts/assert-tokens-published.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - run: pnpm check:package "$PACKAGE"
        env:
          PACKAGE: ${{ steps.request.outputs.package }}

  publish:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-release-tag.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - run: node scripts/assert-tokens-published.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - run: npm install --global npm@11.5.1
      - name: Build the package and its dependencies
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: pnpm --filter "@scalewing/${PACKAGE}..." build
      - name: Pack the public package
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/scalewing-release"
          pnpm --filter "@scalewing/${PACKAGE}" pack --pack-destination "$RUNNER_TEMP/scalewing-release"
      - name: Publish with npm trusted publishing
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#*-v}"
          npm publish "$RUNNER_TEMP/scalewing-release/scalewing-${PACKAGE}-${version}.tgz" --access public --provenance
